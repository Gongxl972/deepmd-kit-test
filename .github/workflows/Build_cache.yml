name: Build Cache for PR Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -U uv

      - name: Build wheel
        run: |
          # 显式安装官方 build 工具
          pip install --force-reinstall build wheel packaging

          # 安装项目运行依赖（与 test_PR.yml 保持一致）
          uv pip install --system --group pin_pytorch_cpu --torch-backend cpu --prerelease=allow

          # 清理可能存在的本地 build 文件夹，防止命名冲突
          rm -rf build/

          # 编译生成 wheel
          python -m build --wheel --outdir dist/

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cached-wheel-py3.10
          path: dist/*.whl
          retention-days: 7
