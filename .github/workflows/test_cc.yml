name: Test C++

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
      - "copilot/**"
      - "dependabot/**"
      - "pre-commit-ci-update-config"
  pull_request:
  merge_group:

jobs:
  # ================================================================
  # Build & CTest
  # ================================================================
  buildcc:
    name: Build & CTest (${{ matrix.backend }}, memleak=${{ matrix.memleak }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
            memleak: true
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
            memleak: true
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
            memleak: false
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
            memleak: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install uv

      - name: Install Python deps (build & test)
        run: |
          # 针对 Paddle 后端：强制禁用其他后端的 C++ 构建，避免寻找无关的 C++ 库导致失败
          if [ "${{ matrix.backend }}" = "paddle" ]; then
            export DP_ENABLE_TENSORFLOW=0
            export DP_ENABLE_PYTORCH=0
          fi

          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            # 改为普通安装 . 避免 scikit-build-core 隔离环境缺陷
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test] i-PI mpi4py
          else
            # Paddle 矩阵：补充安装 orbax-checkpoint 以满足 convert-models.sh 中 JAX 模型转换的依赖要求
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test] i-PI mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle orbax-checkpoint
          fi

      - name: Export backend roots (for TF/PT)
        if: matrix.backend == 'tf_torch'
        run: |
          echo "TF_ROOT=$(python -c 'import tensorflow as tf; print(tf.sysconfig.get_lib_dir())')" >> $GITHUB_ENV
          echo "TORCH_ROOT=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> $GITHUB_ENV

      - name: Convert models
        run: |
          bash source/tests/infer/convert-models.sh

      - name: Fix kernel mmap rnd bits
        if: matrix.memleak == true
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build & CTest (via test_cc_local.sh)
        run: |
          bash source/install/test_cc_local.sh

      - name: Collect runtime bundle
        run: |
          mkdir -p dp_test
          cp -r source/build_tests/dp_test/* dp_test/ 2>/dev/null || true
          cp -r source/tests/infer dp_test/tests/ 2>/dev/null || true
          
          # 补充 Paddle 动态库
          if [ "${{ matrix.backend }}" = "paddle" ]; then
            find source/build_tests/paddle_inference_install_dir -name '*.so*' \
              \( -path '*/paddle/lib/*' -o -path '*/onednn/lib/*' -o -path '*/mklml/lib/*' \) \
              -exec cp -t dp_test/lib/ {} + || true
          fi
          
          # 补充 LAMMPS 插件路径
          mkdir -p dp_test/lib/deepmd_lmp
          cp source/build_tests/libdeepmd_lmp.* dp_test/lib/deepmd_lmp/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-${{ matrix.memleak }}
          path: dp_test/
          retention-days: 1
          if-no-files-found: error

  # ================================================================
  # LAMMPS tests (仅 non-memleak)
  # ================================================================
  test_lammps:
    name: LAMMPS (${{ matrix.backend }})
    needs: buildcc
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-false
          path: dp_test/
      - name: Install Python deps (LAMMPS)
        run: |
          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test] lammps mpi4py
          else
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test] lammps mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle
          fi
      - name: Run LAMMPS tests
        run: |
          export PATH="$PWD/dp_test/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/dp_test/lib:$LD_LIBRARY_PATH"
          export LAMMPS_PLUGIN_PATH="$PWD/dp_test/lib/deepmd_lmp"
          export OMP_NUM_THREADS=1
          export TF_INTRA_OP_PARALLELISM_THREADS=1
          export TF_INTER_OP_PARALLELISM_THREADS=1
          source/install/retry_on_sigterm.sh 3 pytest --cov=deepmd source/lmp/tests
        env:
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle }}
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true

  # ================================================================
  # iPI tests (仅 non-memleak)
  # ================================================================
  test_ipi:
    name: iPI (${{ matrix.backend }})
    needs: buildcc
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-false
          path: dp_test/
      - name: Install Python deps (iPI)
        run: |
          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test,ipi,jax,torch] i-PI mpi4py
          else
            source/install/uv_with_retry.sh pip install --system \
              .[cpu,test,ipi] i-PI mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle
          fi
      - name: Run iPI tests
        run: |
          export PATH="$PWD/dp_test/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/dp_test/lib:$LD_LIBRARY_PATH"
          export OMP_NUM_THREADS=1
          export TF_INTRA_OP_PARALLELISM_THREADS=1
          export TF_INTER_OP_PARALLELISM_THREADS=1
          pytest --cov=deepmd source/ipi/tests
        env:
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle }}
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true

  # ================================================================
  # Pass gate
  # ================================================================
  pass:
    name: Pass testing C++
    needs: [buildcc, test_lammps, test_ipi]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
    permissions:
      id-token: write
