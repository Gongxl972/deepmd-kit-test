name: Test C++ parallel (buildcc → lammps/ipi)

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
      - "copilot/**"
      - "dependabot/**"
      - "pre-commit-ci-update-config"
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # Build + CTest + 打包完整 bundle
  # ================================================================
  buildcc:
    name: Build & CTest (${{ matrix.backend }}, memleak=${{ matrix.memleak }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - memleak: true
            backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - memleak: true
            backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
          - memleak: false
            backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - memleak: false
            backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build libgtest-dev \
            openmpi-bin libopenmpi-dev libfabric1 \
            libfftw3-dev libgomp1
      - run: python -m pip install uv
      - name: Install Python deps (build & test)
        run: |
          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,lmp,ipi,jax,torch] mpi4py
          else
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,lmp,ipi] mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle
          fi
      - name: Export backend roots (for TF/PT)
        if: matrix.backend == 'tf_torch'
        run: |
          echo "TENSORFLOW_ROOT=$(python -c 'import importlib.util,pathlib;print(pathlib.Path(importlib.util.find_spec("tensorflow").origin).parent)')" >> "$GITHUB_ENV"
          echo "PYTORCH_ROOT=$(python -c 'import torch;print(torch.__path__[0])')" >> "$GITHUB_ENV"
      # ---- 模型转换（原版步骤，确保测试模型就绪） ----
      - name: Convert models
        run: source/tests/infer/convert-models.sh
      # ---- 内核参数修复（仅 memleak 时需要） ----
      - name: Fix kernel mmap rnd bits
        if: matrix.memleak
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build & CTest (via test_cc_local.sh)
        env:
          DP_VARIANT: cpu
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle }}
          CXXFLAGS: ${{ matrix.memleak && '-fsanitize=leak -g' || '-g' }}
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/workflows/suppr.txt
        run: source/install/test_cc_local.sh
      # ---- 收集 Paddle 额外动态库（仅 paddle 后端） ----
      - name: Collect Paddle extra libraries
        if: matrix.enable_paddle == 'TRUE'
        run: |
          # 假设 test_cc_local.sh 已将 paddle 推理库放在 source/build_tests/paddle_inference_install_dir
          PADDLE_DIR="${{ github.workspace }}/source/build_tests/paddle_inference_install_dir"
          if [ -d "$PADDLE_DIR" ]; then
            cp -v "$PADDLE_DIR/paddle/lib/"*.so* dp_test/lib/ 2>/dev/null || true
            cp -v "$PADDLE_DIR/third_party/install/onednn/lib/"* dp_test/lib/ 2>/dev/null || true
            cp -v "$PADDLE_DIR/third_party/install/mklml/lib/"* dp_test/lib/ 2>/dev/null || true
          else
            echo "Warning: Paddle inference directory not found at $PADDLE_DIR"
          fi
      # ---- 复制模型文件到 dp_test（确保下游有完整模型） ----
      - name: Copy model files to dp_test
        run: |
          mkdir -p dp_test/tests
          cp -r source/tests/infer dp_test/tests/
      # ---- 验证 bundle 完整性（可选，帮助调试） ----
      - name: Verify bundle contents
        run: |
          echo "=== bin ==="
          ls -la dp_test/bin/ || echo "(empty)"
          echo "=== lib ==="
          ls -la dp_test/lib/ || echo "(empty)"
          echo "=== lib/deepmd_lmp ==="
          ls -la dp_test/lib/deepmd_lmp/ 2>/dev/null || echo "(not exist)"
          echo "=== tests ==="
          find dp_test/tests -maxdepth 2 -type f | head -20
      - name: Upload artifact (dp_test)
        uses: actions/upload-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-${{ matrix.memleak }}
          path: dp_test/
          retention-days: 1
          if-no-files-found: error

  # ================================================================
  # LAMMPS tests (仅 non-memleak)
  # ================================================================
  test_lammps:
    name: LAMMPS (${{ matrix.backend }})
    needs: buildcc
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-false
          path: dp_test/
      # ---- 安装 Python 依赖（使用 pip/uv 缓存加速，但仍需安装 deepmd 包本身） ----
      - name: Install Python deps (LAMMPS)
        run: |
          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,lmp,ipi,jax,torch] mpi4py
          else
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,lmp,ipi] mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle
          fi
      - name: Run LAMMPS tests
        run: |
          export PATH="$PWD/dp_test/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/dp_test/lib:$LD_LIBRARY_PATH"
          export LAMMPS_PLUGIN_PATH="$PWD/dp_test/lib/deepmd_lmp"
          export OMP_NUM_THREADS=1
          export TF_INTRA_OP_PARALLELISM_THREADS=1
          export TF_INTER_OP_PARALLELISM_THREADS=1
          # 使用 retry 增加稳定性（原版做法）
          source/install/retry_on_sigterm.sh 3 pytest --cov=deepmd source/lmp/tests
        env:
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle }}
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true

  # ================================================================
  # iPI tests (仅 non-memleak)
  # ================================================================
  test_ipi:
    name: iPI (${{ matrix.backend }})
    needs: buildcc
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: tf_torch
            enable_tensorflow: TRUE
            enable_pytorch: TRUE
            enable_paddle: FALSE
          - backend: paddle
            enable_tensorflow: FALSE
            enable_pytorch: FALSE
            enable_paddle: TRUE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        with:
          name: dp-${{ matrix.backend }}-memleak-false
          path: dp_test/
      - name: Install Python deps (iPI)
        run: |
          if [ "${{ matrix.backend }}" = "tf_torch" ]; then
            source/install/uv_with_retry.sh pip install --system \
              --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu \
              --torch-backend cpu
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,ipi,jax,torch] i-PI mpi4py
          else
            source/install/uv_with_retry.sh pip install --system \
              -e .[cpu,test,ipi] i-PI mpi4py
            source/install/uv_with_retry.sh pip install --system paddlepaddle
          fi
      - name: Run iPI tests
        run: |
          export PATH="$PWD/dp_test/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/dp_test/lib:$LD_LIBRARY_PATH"
          export OMP_NUM_THREADS=1
          export TF_INTRA_OP_PARALLELISM_THREADS=1
          export TF_INTER_OP_PARALLELISM_THREADS=1
          pytest --cov=deepmd source/ipi/tests
        env:
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle }}
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true

  # ================================================================
  # Pass gate
  # ================================================================
  pass:
    name: Pass testing C++
    needs: [buildcc, test_lammps, test_ipi]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
    permissions:
      id-token: write
